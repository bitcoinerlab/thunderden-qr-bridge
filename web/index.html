<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thunder Den QR bridge</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/brand/thunderden.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <h1><img src="/brand/thunderden-horizontal-graphite.svg" alt="Thunder Den" width="220" height="49"> <span>QR bridge</span></h1>
  <p id="status" role="status">To begin, start an action in your wallet app on this computer. This page will show a QR code when the request is ready.</p>
  <p id="last-reply" hidden></p>
  <section id="job" hidden>
    <div id="qr-view">
      <header class="review-header">
        <h2 id="request-title">1. Scan this QR with Thunder Den</h2>
        <h2 id="reply-title" hidden>2. Scan Thunder Den’s reply</h2>
        <div class="qr-controls">
          <button id="back" hidden>← Back to request QR</button>
          <button id="fullscreen" aria-pressed="false">Full screen</button>
          <button id="cancel">Cancel request</button>
        </div>
      </header>
      <div id="request-view" class="preview">
        <canvas id="qr" aria-label="Request QR code"></canvas>
      </div>
      <div id="reply-view" class="preview" hidden>
        <video id="video" autoplay playsinline muted hidden></video>
      </div>
      <footer>
        <div id="next-step">
          <p id="reply-prompt">When Thunder Den shows its reply QR:</p>
          <button id="camera" aria-describedby="reply-prompt progress">Open camera →</button>
        </div>
        <p id="progress" role="status"></p>
      </footer>
    </div>
  </section>
</body>
</html>
